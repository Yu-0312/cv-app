name: Career Ops Auto-Refresh (expiry gate)

# Between the three scheduled full runs (Taiwan 06:00 / 12:00 / 20:00), check the
# committed snapshot's expiry rate every 2 hours. If more than 25% of jobs have
# expired, trigger the full Career Ops pipeline (scrape + evaluate + publish) by
# calling the reusable career-ops.yml workflow. On healthy runs this exits in
# seconds without scraping.

on:
  workflow_dispatch:
  schedule:
    # Every 2 hours (UTC). Cheap health check; only escalates to a full refresh
    # when expiry >= 25%.
    - cron: "0 */2 * * *"

# NOTE: no workflow-level concurrency here on purpose. The reusable career-ops.yml
# it calls already uses the `career-ops-snapshot` concurrency group, which
# serialises the actual refresh against the scheduled full runs. Putting the same
# group on this parent workflow would deadlock (parent waits for child that waits
# for the group the parent holds).

# contents: write is required because the refresh job calls the reusable
# career-ops.yml, which commits and pushes the updated snapshot. A called
# workflow runs with the caller's token permissions.
permissions:
  contents: write

jobs:
  gate:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    outputs:
      needsScrape: ${{ steps.check.outputs.needsScrape }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install

      - name: Check expiry rate (threshold 25%)
        id: check
        run: |
          if [ ! -f tooling/data/app/career-ops-jobs.json ]; then
            echo "No snapshot on disk yet — requesting refresh."
            echo "needsScrape=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          node tooling/scripts/career-ops-health-monitor.mjs \
            --jobs tooling/data/app/career-ops-jobs.json \
            --out /tmp/career-ops-health.json \
            --report-out /tmp/career-ops-health.md \
            --threshold 0.25
          NEEDS=$(node -e "const h=require('/tmp/career-ops-health.json');process.stdout.write(h.needsScrape ? 'true' : 'false')")
          echo "Expiry gate needsScrape=$NEEDS"
          echo "needsScrape=$NEEDS" >> "$GITHUB_OUTPUT"

  refresh:
    needs: gate
    if: needs.gate.outputs.needsScrape == 'true'
    uses: ./.github/workflows/career-ops.yml
    secrets: inherit
