name: Career Ops Snapshot

on:
  workflow_dispatch:
  schedule:
    - cron: "17 22 * * *"

concurrency:
  group: career-ops-snapshot
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  career-ops:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install

      - name: Job health check (report expiry rate before scrape)
        run: |
          if [ -f tooling/data/app/career-ops-jobs.json ]; then
            node tooling/scripts/career-ops-health-monitor.mjs \
              --jobs tooling/data/app/career-ops-jobs.json \
              --out tooling/data/app/career-ops-job-health.json \
              --report-out tooling/data/app/career-ops-job-health-report.md \
              --threshold 0.30
          fi

      - name: Build sources and scrape jobs
        run: |
          if [ -f tooling/data/career-ops-source-strategy.json ]; then
            npm run career-ops:sources:build
          fi
          if [ -f tooling/data/career-ops-source-flex.json ]; then
            npm run career-ops:source-flex
          fi
          if [ ! -f tooling/data/career-ops-sources.json ]; then
            echo "tooling/data/career-ops-sources.json not found; skipping."
            exit 0
          fi
          npm run career-ops:scrape -- --include-expired
          npm run career-ops:quality
          if [ -f tooling/data/career-ops-singapore-sources.json ]; then
            npm run career-ops:sg:scrape
          fi

      - name: Run analysis pipeline
        run: |
          PROFILE_FLAG=""
          if [ -f tooling/data/career-ops-profile.json ]; then
            PROFILE_FLAG="--profile tooling/data/career-ops-profile.json"
          fi
          npm run career-ops:evaluate -- $PROFILE_FLAG
          npm run career-ops:intelligence -- $PROFILE_FLAG
          npm run career-ops:application-kit -- $PROFILE_FLAG
          npm run career-ops:deep-research -- $PROFILE_FLAG
          npm run career-ops:compensation -- $PROFILE_FLAG
          npm run career-ops:story-bank -- $PROFILE_FLAG
          npm run career-ops:parallel -- $PROFILE_FLAG
          # Deep fit: Layer A (25), Layer B (40), Layer C (30) = up to 95 results
          node tooling/scripts/career-ops-deep-fit.mjs $PROFILE_FLAG \
            --top-a 25 --top-b 40 --top-c 30 \
            --out tooling/data/app/career-ops-deep-fit.json \
            --js-out tooling/data/app/career-ops-deep-fit.js \
            --report-out tooling/data/app/career-ops-deep-fit.md
          npm run career-ops:learn -- $PROFILE_FLAG
          npm run career-ops:modes

      - name: Post-scrape health check (update expiry stats)
        run: |
          node tooling/scripts/career-ops-health-monitor.mjs \
            --jobs tooling/data/app/career-ops-jobs.json \
            --out tooling/data/app/career-ops-job-health.json \
            --report-out tooling/data/app/career-ops-job-health-report.md \
            --threshold 0.30

      - name: Publish Career Ops snapshot to Supabase Storage
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          CAREER_OPS_STORAGE_BUCKET: ${{ vars.CAREER_OPS_STORAGE_BUCKET }}
          CAREER_OPS_STORAGE_PREFIX: ${{ vars.CAREER_OPS_STORAGE_PREFIX }}
        run: |
          if [ -z "$SUPABASE_SERVICE_ROLE_KEY" ]; then
            echo "::error::Missing SUPABASE_SERVICE_ROLE_KEY repository secret."
            exit 1
          fi
          npm run career-ops:snapshot:publish -- --jobs-per-shard 1000

      - name: Verify runtime data availability
        run: |
          npm run build
          npm run runtime:data:verify

      - name: Commit updated snapshot
        run: |
          if git diff --quiet -- tooling/data; then
            echo "No Career Ops snapshot changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -u -- tooling/data
          if git diff --cached --quiet; then
            echo "No tracked Career Ops snapshot changes."
            exit 0
          fi
          git commit -m "Update Career Ops snapshot"
          git pull --rebase origin main
          git push
