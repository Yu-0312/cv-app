name: Career Ops Snapshot

on:
  workflow_dispatch:
  schedule:
    # Runs daily at 06:17 Asia/Taipei.
    - cron: "17 22 * * *"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  career-ops:
    name: Build Career Ops snapshot
    runs-on: ubuntu-latest
    timeout-minutes: 360
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Build Career Ops job snapshot
        run: |
          if [ -f data/career-ops-source-strategy.json ] || [ -f data/career-ops-sources.json ]; then
            npm run career-ops:daily -- --concurrency 4
          else
            echo "No Career Ops source strategy or sources file found; using existing snapshot."
          fi
          if [ -f data/career-ops-singapore-sources.json ]; then
            npm run career-ops:sg:scrape
          fi
      - name: Publish Career Ops snapshot to Supabase Storage
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          CAREER_OPS_STORAGE_BUCKET: ${{ vars.CAREER_OPS_STORAGE_BUCKET }}
          CAREER_OPS_STORAGE_PREFIX: ${{ vars.CAREER_OPS_STORAGE_PREFIX }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_SERVICE_ROLE_KEY" ]; then
            echo "::error::Missing SUPABASE_URL or SUPABASE_SERVICE_ROLE_KEY repository secret."
            exit 1
          fi
          npm run career-ops:snapshot:publish -- --jobs-per-shard 1000
      - name: Build static site
        run: npm run build
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: career-ops
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
